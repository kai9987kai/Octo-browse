name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

# A branch with an open PR triggers both `push` and `pull_request`; without
# this the whole matrix runs twice for every commit.
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install linters
        run: python -m pip install "ruff>=0.15"
      - name: Ruff
        run: ruff check --output-format=github .

  test:
    name: Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # Installing requirements.txt is what makes `cache: pip` honest, and it
      # means a broken requirements file fails here rather than at release time.
      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "coverage>=7.6"
      - name: Compile sources
        run: python -m compileall -q main.py alpha.py octobrowse tests
      - name: Run regression tests with coverage
        env:
          QT_QPA_PLATFORM: offscreen
          QTWEBENGINE_CHROMIUM_FLAGS: "--no-sandbox --disable-gpu"
        run: coverage run -m unittest discover -s tests -v
      - name: Coverage report
        run: coverage report
      # The pure-logic package is where the project's testable value lives, so
      # it carries a much higher floor than the Qt-heavy main.py.
      - name: Coverage floor for octobrowse/
        run: coverage report --include="octobrowse/*" --fail-under=85

  windows:
    name: Windows smoke
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run regression tests
        env:
          QT_QPA_PLATFORM: offscreen
          QTWEBENGINE_CHROMIUM_FLAGS: "--no-sandbox --disable-gpu"
        run: python -m unittest discover -s tests
      # verify_release.ps1 depends on this flag, but nothing exercised it on
      # the platform OctoBrowse actually ships to until now.
      - name: Application smoke test
        env:
          QT_QPA_PLATFORM: offscreen
          QTWEBENGINE_CHROMIUM_FLAGS: "--no-sandbox --disable-gpu"
        run: python main.py --smoke-test
      - name: Analyse packaging scripts
        shell: pwsh
        continue-on-error: true
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -ErrorAction Stop
          Invoke-ScriptAnalyzer -Path packaging -Recurse -Severity Error
